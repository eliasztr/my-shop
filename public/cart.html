<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - My Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="/" class="navbar-logo">✦ My Shop</a>
  <div class="navbar-search">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Search..." onkeydown="if(event.key==='Enter') location.href='/?q='+this.value">
  </div>
  <div class="navbar-actions">
    <a href="cart.html" class="cart-btn">🛒<span class="cart-count" id="cartCount">0</span></a>
  </div>
</nav>

<div class="cart-section">
  <h1>🛒 Shopping Cart</h1>
  <div class="gold-divider" style="margin-top:8px"></div>
  <div id="cartContent"></div>
</div>

<a href="https://wa.me/96170621593" target="_blank" class="whatsapp-btn">
  <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/whatsapp.svg" width="28" height="28" style="filter:invert(1)">
</a>

<div class="toast" id="toast"></div>
<script src="script.js"></script>
<script src="cart.js"></script>
</body>
</html>
